<!doctype html>
<!-- template-tier2.html — the reference-site Tier 2 showcase template, a variant
     of assets/template.html. It keeps the base reading skeleton (base.css +
     base.js + header.site / main > article / footer) and adds the two things a
     Lua filter cannot: the comments-gutter class on <html>, and the Tier 2
     component <head> tags. Built via scripts/build-reference-site.sh
     (--template this --filter filters/tier2.lua). -->
<html lang="en" class="comments-gutter">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$title$</title>
<!-- no-flash theme boot: storage key must match base.js THEME_KEY ('html-docs-theme') -->
<script>try{var t=localStorage.getItem('html-docs-theme');if(t==='dark')document.documentElement.classList.add('theme-dark');else if(t==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
<link rel="stylesheet" href="assets/base.css" />
<script src="assets/base.js" defer></script>

<!-- This page uses all four Tier 2 components, so it ships all four. A page that
     renders no diffs must not ship the diff bundle. -->
<!-- highlight: the highlight.js bundle first, then the glue -->
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js" defer></script>
<link rel="stylesheet" href="assets/components/highlight/highlight.css" />
<script src="assets/components/highlight/highlight.js" defer></script>
<!-- diff: diff2html -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html@3/bundles/css/diff2html.min.css" />
<script src="https://cdn.jsdelivr.net/npm/diff2html@3/bundles/js/diff2html-ui.min.js"></script>
<link rel="stylesheet" href="assets/components/diff/diff.css" />
<script src="assets/components/diff/diff.js" defer></script>
<!-- diagram: mermaid, as an ES module -->
<link rel="stylesheet" href="assets/components/diagram/diagram.css" />
<script type="module" src="assets/components/diagram/diagram.js"></script>
<!-- comments: no engine, no CDN — vanilla, offline. After base.js so the 💬
     toggle mounts into base.js's .fab stack. -->
<link rel="stylesheet" href="assets/components/comments/comments.css" />
<script src="assets/components/comments/comments.js" defer></script>
</head>
<body>
<header class="site">
<a href="index.html">$if(site-name)$$site-name$$else$Home$endif$</a>
</header>
<main>
<article>
$body$
</article>
</main>
<footer>$if(back-link)$<a href="index.html">$back-link$</a>$endif$</footer>
</body>
</html>
