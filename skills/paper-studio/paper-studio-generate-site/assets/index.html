<!DOCTYPE html>
<!-- paper-studio generate-site: landing page skeleton.
     Replace the UPPERCASE placeholders; keep the overall structure and only
     use classes from the base.css + pdf-studio.css catalog (shared with pdf-studio
     via pdf-studio-site-base). Keep the four <head> asset refs (bundled locally);
     external URLs (web fonts, CDN libraries, remote images) are allowed where a page needs them. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="paper-studio">
<title>SITE_TITLE</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/pdf-studio.css">
<!-- theme boot: apply the saved theme before first paint (no flash). Keep verbatim; key must match base.js THEME_KEY. -->
<script>try{var t=localStorage.getItem('html-docs-theme');if(t==='dark')document.documentElement.classList.add('theme-dark');else if(t==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
<script src="assets/base.js" defer></script>
<!-- page-to-page nav manifest: the single source of truth every page loads, written
     to site/assets/ in Phase 3 (the generated report pages reference it the same way,
     via their context-js frontmatter). Must load before pdf-studio.js; defer keeps order. -->
<script src="assets/nav-manifest.js" defer></script>
<script src="assets/pdf-studio.js" defer></script>
</head>
<body>
<main>
  <div class="hero">
    <p class="kicker">論文ガイド</p>
    <h1>SITE_TITLE</h1>
    <p class="lede">HERO_LEDE — この論文が何を提案し、誰に何をもたらすかを2〜3文で。</p>
    <div class="meta">
      <span class="chip count">全Nレポート</span>
      <span class="chip audio">🔊 音声ガイド M本</span>
    </div>
    <a class="cta" href="overview.html">全体レポートを読む</a>
  </div>

  <h2>レポート</h2>
  <!-- One <li> per page in reading order (overview first, then 背景→手法→実験→議論→関連研究).
       Cards carry no hue: color means something in this design system, so reports are not color-coded. -->
  <ol class="cards">
    <li>
      <a href="SLUG.html">
        <span class="num">KICKER<!-- 全体レポート / 背景 / 手法 … --></span>
        <span class="t">CARD_TITLE</span>
        <span class="s">CARD_SUMMARY — 2〜3行。</span>
        <span class="meta">
          <span class="chip time">⏱ 約N分</span><!-- optional reading-time estimate -->
          <span class="chip audio">🔊 音声ガイド</span><!-- optional, only when audio exists -->
        </span>
      </a>
    </li>
  </ol>

  <!-- optional: audio without a matching report page -->
  <h2>音声ガイド</h2>
  <div class="player"><span>🔊 LABEL</span><audio controls preload="none" src="audio/FILE.m4a"></audio></div>
</main>
<footer>Generated by paper-studio</footer>
</body>
</html>
