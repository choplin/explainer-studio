<!DOCTYPE html>
<!-- pdf-studio generate-site: chapter/report page skeleton.
     Replace the UPPERCASE placeholders; keep the overall structure and only
     use classes from the base.css + pdf-studio.css catalog. Delete optional
     blocks that do not apply. Keep the four <head> asset refs (bundled locally);
     external URLs (web fonts, CDN libraries, remote images) are allowed where a page needs them. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="pdf-studio">
<title>PAGE_TITLE — SITE_TITLE</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/pdf-studio.css">
<!-- theme boot: apply the saved theme before first paint (no flash). Keep verbatim; key must match base.js THEME_KEY. -->
<script>try{var t=localStorage.getItem('html-docs-theme');if(t==='dark')document.documentElement.classList.add('theme-dark');else if(t==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
<script src="assets/base.js" defer></script>
<!-- page-to-page nav manifest: the ONE source of truth for the site's page list,
     generated once per site (not a per-page copy). Must load before pdf-studio.js
     (which reads window.__PDF_STUDIO_NAV); defer keeps document order. Keep this line
     verbatim and identical on every page — the content lives in nav-manifest.js, so
     adding/removing a page updates the nav everywhere by regenerating that one file. -->
<script src="nav-manifest.js" defer></script>
<script src="assets/pdf-studio.js" defer></script>
</head>
<!-- No chapter hue: color carries meaning here, so pages are not color-coded. -->
<body>
<header class="site"><a href="index.html">← SITE_TITLE</a></header>
<main>
  <!-- optional: only when a matching audio guide exists -->
  <div class="player"><span>🔊 音声ガイド</span><audio controls preload="none" src="audio/SLUG.m4a"></audio></div>

  <article>
    <p class="kicker">KICKER<!-- e.g. 第2章 / 全体レポート --></p>
    <h1>PAGE_TITLE</h1>
    <p class="lede">LEDE — 2〜3文でこのページの内容と読む価値を要約する。</p>

    <section class="keypoints">
      <h2>この章のポイント</h2>
      <ul>
        <li>KEY_POINT（3〜5個）</li>
      </ul>
    </section>

    <!-- BODY: restructured content.
         Building blocks: <h2>/<h3> sections, <p>, <ul>/<ol>,
         <div class="tablewrap"><table>…</table></div>, <blockquote>,
         <p class="pullquote">…</p> (印象的な一文, 1ページ1回まで),
         <span class="p">pNN</span> (ページアンカー),
         <mark>…</mark> (重要語のインラインハイライト, 使いすぎない).

         Semantic callouts — pick the variant by MEANING (color+icon are automatic):
           <div class="callout">…</div>          ℹ️ 補足・注記 (note)
           <div class="callout tip">…</div>       💡 コツ・ヒント
           <div class="callout warn">…</div>      ⚠️ 注意・落とし穴
           <div class="callout danger">…</div>    🚫 禁止・重大な警告
           <div class="callout key">…</div>       🔑 重要インサイト・要点
         Optional colored lead-in: <span class="label">結論:</span> … -->

    <!-- Prev/next page links are rendered here at runtime by pdf-studio.js from
         nav-manifest.js — do NOT author a <nav class="chapnav"> by hand. The whole
         point is that the page list has a single source (the manifest); hardcoding
         neighbor links per page is exactly the drift this replaces. Without JS the
         body still reads fine and the header "← SITE_TITLE" link returns to the index. -->
  </article>
</main>
<footer>Generated by pdf-studio</footer>
</body>
</html>
