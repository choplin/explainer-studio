<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>$title$</title>
<!-- no-flash theme boot: storage key must match base.js THEME_KEY ('explainer-html-docs-theme') -->
<script>try{var t=localStorage.getItem('explainer-html-docs-theme');if(t==='dark')document.documentElement.classList.add('theme-dark');else if(t==='light')document.documentElement.classList.add('theme-light');}catch(e){}</script>
<link rel="stylesheet" href="assets/base.css" />
$for(context-css)$<link rel="stylesheet" href="assets/$context-css$" />
$endfor$<script src="assets/base.js" defer></script>
$for(context-js)$<script src="assets/$context-js$" defer></script>
$endfor$</head>
<!-- layout variant, most specific first: the page's own `layout:` frontmatter,
     then build.sh --layout (passed as layout-default), then `standard`. -->
<body class="layout-$if(layout)$$layout$$else$$if(layout-default)$$layout-default$$else$standard$endif$$endif$">
<header class="site">
<a href="index.html">$if(site-name)$$site-name$$else$Home$endif$</a>
</header>
<main>
<article>
$body$
</article>
</main>
<footer>$if(back-link)$<a href="index.html">$back-link$</a>$endif$</footer>
</body>
</html>
