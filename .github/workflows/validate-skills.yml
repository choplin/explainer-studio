name: Validate Agent Skills

on:
  pull_request:
    paths:
      - ".github/workflows/validate-skills.yml"
      - "README.md"
      - "scripts/check-skills.sh"
      - "skills/**"
      - "tests/fixtures/invalid-skill-frontmatter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-skills.yml"
      - "README.md"
      - "scripts/check-skills.sh"
      - "skills/**"
      - "tests/fixtures/invalid-skill-frontmatter/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install skill-validator
        run: |
          archive="skill-validator_1.6.0_linux_amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL \
            "https://github.com/agent-ecosystem/skill-validator/releases/download/v1.6.0/${archive}" \
            -o "${RUNNER_TEMP}/${archive}"
          cd "${RUNNER_TEMP}"
          echo "1c42c832880d8a8d311346c73dfdbd002670df34774583ebad548b350da479f6  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" skill-validator
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Validate Agent Skills
        run: ./scripts/check-skills.sh
