name: Validate Agent Skills

on:
  pull_request:
    paths:
      - ".github/workflows/validate-skills.yml"
      - "README.md"
      - "scripts/check-skills.sh"
      - "skills/**"
      - "tests/fixtures/invalid-skill-frontmatter/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-skills.yml"
      - "README.md"
      - "scripts/check-skills.sh"
      - "skills/**"
      - "tests/fixtures/invalid-skill-frontmatter/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install skill-validator
        run: |
          git clone https://github.com/choplin/skill-validator.git "${RUNNER_TEMP}/skill-validator"
          git -C "${RUNNER_TEMP}/skill-validator" checkout be8d7501a54468f4ec1fa697c1ea3846fbb0fac6
          (
            cd "${RUNNER_TEMP}/skill-validator"
            GOBIN="${RUNNER_TEMP}/bin" go install ./cmd/skill-validator
          )
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Validate Agent Skills
        run: ./scripts/check-skills.sh
