name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${TAG#v}"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          awk -v version="${version}" '
            index($0, "## [" version "] - ") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "${notes_file}"

          if [[ ! -s "${notes_file}" ]]; then
            echo "error: CHANGELOG.md has no release section for ${version}" >&2
            exit 1
          fi

          echo "file=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${NOTES_FILE}"
